<div class="counter-controls">
  <h3>Counter Controls</h3>

  <div class="buttons">
    <button class="btn-decrement" type="button" (click)="onDecrement()">-</button>
    <button class="btn-increment" type="button" (click)="onIncrement()">+</button>
    <button class="btn-reset" type="button" (click)="onReset()">Reset</button>
  </div>
</div>
